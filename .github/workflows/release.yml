name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Validate tag and project version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          [xml]$project = Get-Content './src/AdrenalinProfileViewer/AdrenalinProfileViewer.csproj'
          $projectVersion = [string]$project.Project.PropertyGroup.Version
          $tagVersion = '${{ github.ref_name }}'.TrimStart('v')
          if ($projectVersion -ne $tagVersion) {
            throw "Tag version $tagVersion does not match project version $projectVersion."
          }

      - name: Restore
        run: dotnet restore ./src/AdrenalinProfileViewer/AdrenalinProfileViewer.csproj

      - name: Publish self-contained EXE
        run: >-
          dotnet publish ./src/AdrenalinProfileViewer/AdrenalinProfileViewer.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:PublishTrimmed=false
          -p:DebugType=None
          -p:DebugSymbols=false
          -o ./dist/release-publish

      - name: Prepare release assets
        id: assets
        shell: pwsh
        run: |
          $version = (Get-Content './VERSION.txt').Trim()
          $tag = if ('${{ github.ref_name }}' -like 'v*') { '${{ github.ref_name }}' } else { "v$version" }
          $assetDirectory = './release-assets'
          New-Item -ItemType Directory -Force -Path $assetDirectory | Out-Null

          $assetName = "AdrenalinProfileViewer-$tag-win-x64.exe"
          $sourceExe = './dist/release-publish/AdrenalinProfileViewer.exe'
          $targetExe = Join-Path $assetDirectory $assetName
          Copy-Item $sourceExe $targetExe -Force

          $hash = (Get-FileHash $targetExe -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksumPath = "$targetExe.sha256"
          "$hash  $assetName" | Set-Content $checksumPath -Encoding ascii

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "asset_name=$assetName" >> $env:GITHUB_OUTPUT
          "asset_path=$targetExe" >> $env:GITHUB_OUTPUT
          "checksum_path=$checksumPath" >> $env:GITHUB_OUTPUT

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ steps.assets.outputs.tag }}' `
            '${{ steps.assets.outputs.asset_path }}' `
            '${{ steps.assets.outputs.checksum_path }}' `
            --title "AMD Adrenalin Profile Viewer ${{ steps.assets.outputs.tag }}" `
            --generate-notes `
            --verify-tag

      - name: Upload workflow artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: AdrenalinProfileViewer-win-x64
          path: release-assets/*
