name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore .\src\AdrenalinProfileViewer\AdrenalinProfileViewer.csproj

      - name: Build
        run: dotnet build .\src\AdrenalinProfileViewer\AdrenalinProfileViewer.csproj -c Release --no-restore

      - name: Validate single-file publish
        run: >-
          dotnet publish .\src\AdrenalinProfileViewer\AdrenalinProfileViewer.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:PublishTrimmed=false
          -p:DebugType=None
          -p:DebugSymbols=false
          -o .\dist\ci-single-exe
