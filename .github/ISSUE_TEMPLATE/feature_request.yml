name: Feature request
description: Suggest an improvement or new decoding capability
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What workflow would this improve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the preferred UI or decoding behavior.
    validations:
      required: true
  - type: textarea
    id: examples
    attributes:
      label: Example XML or screenshots
      description: Remove private information before attaching files.
